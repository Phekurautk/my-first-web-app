<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Web App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #243247;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }
    main {
      max-width: 560px;
      margin: 60px auto;
      padding: 36px;
      background: white;
      border: 1px solid #e1e6ee;
      border-radius: 14px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.05);
    }
    h1 { font-size: 28px; }
    p { line-height: 1.6; }
    button {
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      background: #2356a5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #19417f; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to My First Web App!</h1>
    <p>I created this web page using Visual Studio Code as part of my Web Technologies module.</p>
    <button type="button" onclick="showMessage()">Click Me</button>
  </main>
  <script>
    function showMessage() {
      alert("Hello! My first web app is working!");
    }
  </script>
</body>
</html>
